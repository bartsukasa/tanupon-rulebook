<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TANUPON ルール一覧</title>
<meta name="description" content="TANUPON Season2 ルール一覧">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=Share+Tech+Mono&display=swap">
<style>
  /* レイアウト: 左に固定サイドバー(タブ一覧+検索)、右にルール本文。モバイルはドロワー。 */
  /* tsukapyon: 黒ベース × ダークグリーン #2e8b57、角ばった(角丸ほぼ無し)シンプル&かっこいい */
  :root{
    --bg:#0a0a0a; --surface:#131313; --surface-2:#1a1a1a; --surface-3:#202020;
    --border:#2b2b2b; --border-strong:#3a3a3a;
    --accent:#2e8b57; --accent-2:#3fb074; --accent-dim:#1d5637;
    --fg:#ececec; --fg-dim:#b7b7b7; --muted:#808080;
    --sidebar-w:264px; color-scheme:dark;
    --gutter-l:max(18px, env(safe-area-inset-left,0px));
    --gutter-r:max(18px, env(safe-area-inset-right,0px));
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0; background:var(--bg); color:var(--fg); font-family:'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif; font-weight:400; line-height:1.7; -webkit-font-smoothing:antialiased}
  .mono{font-family:'Share Tech Mono','Courier New',monospace}
  a{color:var(--accent-2);text-decoration:none;border-bottom:1px solid var(--accent-dim)}
  a:hover{color:#fff;border-bottom-color:var(--accent-2)}
  .app{display:flex;min-height:100%}
  .sidebar{width:var(--sidebar-w); flex:0 0 var(--sidebar-w); background:var(--surface); border-right:1px solid var(--border); position:sticky; top:0; align-self:flex-start; height:100vh; display:flex; flex-direction:column; padding-left:env(safe-area-inset-left,0px)}
  .brand{padding:20px 18px 16px; border-bottom:1px solid var(--border); display:flex; flex-direction:column; gap:3px}
  .brand .logo{display:flex;align-items:center;gap:9px}
  .brand .mark{width:12px;height:22px;background:var(--accent);box-shadow:3px 0 0 var(--accent-dim)}
  .brand h1{margin:0;font-size:15px;font-weight:900;letter-spacing:.06em}
  .brand .sub{font-size:10.5px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase}
  .brand .updated{font-size:11px;color:var(--accent-2);margin-top:4px}
  .brand .updated .mono{font-size:12px}
  .search{padding:14px 14px 10px}
  .search input{width:100%; background:var(--bg); border:1px solid var(--border-strong); color:var(--fg); padding:11px 12px; font-size:13px; font-family:inherit; outline:none}
  .search input:focus{border-color:var(--accent)}
  .search input::placeholder{color:var(--muted)}
  .nav{flex:1 1 auto; overflow-y:auto; padding:4px 10px 24px}
  .nav button{display:flex; align-items:center; gap:10px; width:100%; text-align:left; background:none; border:none; color:var(--fg-dim); cursor:pointer; font-family:inherit; font-size:13px; padding:10px 11px; border-left:3px solid transparent}
  .nav button:hover{background:var(--surface-2); color:var(--fg)}
  .nav button.active{background:var(--surface-3); color:#fff; border-left-color:var(--accent); font-weight:700}
  .nav button .dot{width:5px;height:5px;background:var(--border-strong);flex:0 0 auto}
  .nav button.active .dot{background:var(--accent-2)}
  .main{flex:1 1 auto; min-width:0; display:flex; flex-direction:column}
  .topbar{position:sticky; top:0; z-index:10; background:rgba(13,13,13,.92); border-bottom:1px solid var(--border); display:flex; align-items:center; gap:12px; padding:14px var(--gutter-r) 14px var(--gutter-l); min-height:58px}
  .topbar .burger{display:none;background:var(--surface-2);border:1px solid var(--border-strong);color:var(--fg);width:38px;height:38px;cursor:pointer;flex:0 0 auto;font-size:16px}
  .topbar h2{margin:0;font-size:17px;font-weight:900;letter-spacing:.03em;flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:10px}
  .topbar h2 .bar{width:5px;height:20px;background:var(--accent);flex:0 0 auto}
  .topbar .count{font-size:11px;color:var(--muted);font-weight:400}
  .refresh{background:var(--accent-dim);border:1px solid var(--accent);color:#eafff3;padding:8px 14px;font-size:12px;font-family:inherit;cursor:pointer;flex:0 0 auto;letter-spacing:.04em}
  .refresh:hover{background:var(--accent)}
  .content{padding:22px var(--gutter-r) 60px var(--gutter-l); max-width:1040px; width:100%}
  .section-label{display:inline-flex; align-items:center; gap:8px; margin:26px 0 14px; font-size:12px; font-weight:900; letter-spacing:.14em; color:var(--accent-2); text-transform:uppercase}
  .section-label:first-child{margin-top:4px}
  .section-label::before{content:"";width:16px;height:2px;background:var(--accent)}
  .rules{display:flex;flex-direction:column;gap:10px}
  .rule{display:grid; grid-template-columns:auto 1fr; gap:14px; background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--accent); padding:14px 16px}
  .rule .no{font-family:'Share Tech Mono',monospace; font-size:12.5px; color:#061a0f; background:var(--accent-2); padding:3px 9px; height:fit-content; white-space:nowrap; letter-spacing:.03em; font-weight:700}
  .rule .no.blank{background:var(--surface-3);color:var(--muted)}
  .rule .body{min-width:0; white-space:pre-wrap; word-break:break-word; font-size:14px; color:var(--fg)}
  .table-wrap{overflow-x:auto; border:1px solid var(--border); background:var(--surface)}
  table{border-collapse:collapse; width:100%; font-size:13px}
  thead th{background:var(--surface-3); color:var(--accent-2); font-weight:700; text-align:left; padding:9px 12px; border-bottom:1px solid var(--border-strong); white-space:pre-wrap; vertical-align:bottom; position:sticky; top:0}
  tbody td{padding:9px 12px; border-bottom:1px solid var(--border); vertical-align:top; white-space:pre-wrap}
  tbody tr:hover{background:var(--surface-2)}
  td.num{font-family:'Share Tech Mono',monospace; font-variant-numeric:tabular-nums}
  .state{color:var(--muted);font-size:13px;padding:50px 4px;text-align:center}
  .state.err{color:#f0a0a0}
  .state .retry{display:inline-block;margin-top:14px;background:var(--accent-dim);border:1px solid var(--accent);color:#eafff3;padding:8px 16px;cursor:pointer;font-family:inherit;font-size:12px}
  .spinner{display:inline-block;width:22px;height:22px;border:3px solid var(--border-strong);border-top-color:var(--accent-2);border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;margin-right:8px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .hint{font-size:11.5px;color:var(--muted);margin-top:18px;padding-top:14px;border-top:1px solid var(--border)}
  .backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40}
  @media (max-width:860px){
    .sidebar{position:fixed; left:0; top:0; z-index:50; height:100%; transform:translateX(-100%); transition:transform .22s ease; width:min(86vw,300px); flex-basis:auto}
    .sidebar.open{transform:none}
    .backdrop.show{display:block}
    .topbar .burger{display:flex;align-items:center;justify-content:center}
  }
  @media (prefers-reduced-motion:reduce){.sidebar{transition:none} .spinner{animation:none}}
</style>
</head>
<body>
<div class="app">
  <div class="backdrop" id="backdrop"></div>
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo"><span class="mark"></span><h1>TANUPON S2</h1></div>
      <span class="sub">Rule Book</span>
      <span class="updated" id="updated"></span>
    </div>
    <div class="search"><input id="search" type="search" placeholder="このタブ内を検索…" autocomplete="off"></div>
    <nav class="nav" id="nav"></nav>
  </aside>
  <main class="main">
    <div class="topbar">
      <button class="burger" id="burger" aria-label="メニュー">☰</button>
      <h2><span class="bar"></span><span id="tab-title">読み込み中</span> <span class="count" id="tab-count"></span></h2>
      <button class="refresh" id="refresh" title="最新のスプレッドシート内容を再読み込み">更新</button>
    </div>
    <div class="content" id="content"></div>
  </main>
</div>

<script>
/* ===== 設定: スプレッドシートと表示タブ ===== */
var SHEET_ID = '1KEtR26N04ygqYvYZfTm5ZdCqDsC6UhK0ysdelg6LbU0';
var TABS = [
  { name:'全体ルール',           gid:'0',          type:'rules' },
  { name:'請求金額 / 最低金額',   gid:'2077565300', type:'table' },
  { name:'犯罪補足',             gid:'1673507175', type:'table' },
  { name:'職業ルール',           gid:'1979250489', type:'rules' },
  { name:'PDルール',             gid:'1677052079', type:'rules' },
  { name:'犯罪者ルール',         gid:'242915000',  type:'rules' },
  { name:'犯罪禁止車両',         gid:'630226675',  type:'table' },
  { name:'EMSルール',            gid:'1446749513', type:'rules' },
  { name:'闇医者ルール',         gid:'458515120',  type:'rules' },
  { name:'メカニックルール',     gid:'1082808880', type:'rules' },
  { name:'飲食店ルール',         gid:'1497219416', type:'rules' },
  { name:'ディーラールール',     gid:'532219762',  type:'rules' },
  { name:'不動産ルール',         gid:'923686319',  type:'rules' },
  { name:'ギャングルール',       gid:'1870408027', type:'rules' },
  { name:'武器屋ルール',         gid:'593251823',  type:'rules' },
  { name:'素材屋ルール',         gid:'1398101424', type:'rules' },
  { name:'バイトルール',         gid:'899757030',  type:'rules' },
  { name:'薬物採取について',     gid:'1060432234', type:'table' },
  { name:'犯罪開始位置①',        gid:'1296085280', type:'table' }
];

var state = { tab:0, q:'' };
var cache = {}; // gid -> rows

/* ===== ユーティリティ ===== */
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function linkify(s){ return esc(s).replace(/(https?:\/\/[^\s）】」]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>'); }
function isUrl(s){ return /^https?:\/\//.test(String(s||'').trim()); }
function isNum(s){ s=String(s||'').trim(); return s!=='' && /^[0-9,.\-\/%]+$/.test(s); }
function matches(s){ if(!state.q) return true; return String(s).toLowerCase().indexOf(state.q)!==-1; }

/* RFC4180 CSV パーサ(引用符内の改行・カンマ・""対応) */
function parseCSV(text){
  var rows=[], row=[], field='', i=0, inQ=false, c;
  text = text.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  while(i<text.length){
    c=text[i];
    if(inQ){
      if(c==='"'){ if(text[i+1]==='"'){ field+='"'; i+=2; continue;} inQ=false; i++; continue; }
      field+=c; i++; continue;
    }
    if(c==='"'){ inQ=true; i++; continue; }
    if(c===','){ row.push(field); field=''; i++; continue; }
    if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; i++; continue; }
    field+=c; i++;
  }
  row.push(field); rows.push(row);
  return rows;
}

/* 末尾の空列・空行を除去 */
function trimGrid(rows){
  var maxCol=0;
  rows.forEach(function(r){ for(var j=r.length-1;j>=0;j--){ if(String(r[j]).trim()!==''){ if(j+1>maxCol)maxCol=j+1; break; } } });
  rows = rows.map(function(r){ return r.slice(0,maxCol); });
  while(rows.length && rows[rows.length-1].join('').trim()==='') rows.pop();
  return rows;
}

function gvizUrl(gid){ return 'https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/gviz/tq?tqx=out:csv&gid='+gid; }

/* ===== データ取得 ===== */
function loadTab(i, force){
  var t = TABS[i]; var content = document.getElementById('content');
  if(cache[t.gid] && !force){ render(); return; }
  content.innerHTML = '<div class="state"><span class="spinner"></span>読み込み中…</div>';
  document.getElementById('tab-count').textContent='';
  fetch(gvizUrl(t.gid), {cache:'no-store'})
    .then(function(res){ if(!res.ok) throw new Error('HTTP '+res.status); return res.text(); })
    .then(function(txt){
      cache[t.gid] = trimGrid(parseCSV(txt));
      stampUpdated();
      if(state.tab===i) render();
    })
    .catch(function(err){
      content.innerHTML = '<div class="state err">読み込みに失敗しました（'+esc(err.message)+'）<br>'+
        'スプレッドシートの共有が「リンクを知っている全員 = 閲覧者」になっているか確認してください。'+
        '<br><button class="retry" id="retrybtn">再試行</button></div>';
      var rb=document.getElementById('retrybtn'); if(rb) rb.onclick=function(){ loadTab(i,true); };
    });
}

/* ===== 描画 ===== */
function buildNav(){
  var nav=document.getElementById('nav'); nav.innerHTML='';
  TABS.forEach(function(t,i){
    var b=document.createElement('button');
    b.className='tabbtn'+(i===state.tab?' active':'');
    b.innerHTML='<span class="dot"></span><span>'+esc(t.name)+'</span>';
    b.onclick=function(){ selectTab(i); closeDrawer(); };
    nav.appendChild(b);
  });
}
function selectTab(i){
  state.tab=i; state.q=''; document.getElementById('search').value='';
  document.querySelectorAll('.nav .tabbtn').forEach(function(el,idx){ el.classList.toggle('active', idx===i); });
  document.getElementById('tab-title').textContent=TABS[i].name;
  loadTab(i,false);
}
function render(){
  var t=TABS[state.tab]; var rows=cache[t.gid]||[];
  var content=document.getElementById('content'); content.innerHTML=''; var shown=0;
  if(!rows.length){ content.innerHTML='<div class="state">項目がありません</div>'; document.getElementById('tab-count').textContent=''; return; }

  if(t.type==='rules'){
    var frag=document.createElement('div'); frag.className='rules'; var lastCat=null;
    for(var r=1;r<rows.length;r++){
      var row=rows[r]||[]; var cat=(row[0]||'').trim(); var no=(row[1]||'').trim(); var text=(row[2]||'');
      if(!no && !String(text).trim()) continue;
      if(matches(no+' '+text)){
        if(cat && cat!==lastCat){ var sl=document.createElement('div'); sl.className='section-label'; sl.textContent=cat; frag.appendChild(sl); lastCat=cat; }
        var card=document.createElement('div'); card.className='rule';
        card.innerHTML='<span class="no'+(no?'':' blank')+'">'+(no?esc(no):'—')+'</span><div class="body">'+linkify(text)+'</div>';
        frag.appendChild(card); shown++;
      }
    }
    content.appendChild(frag);
  } else {
    var wrap=document.createElement('div'); wrap.className='table-wrap';
    var table=document.createElement('table');
    var thead=document.createElement('thead'); var htr=document.createElement('tr');
    (rows[0]||[]).forEach(function(c){ var th=document.createElement('th'); th.textContent=c||''; htr.appendChild(th); });
    thead.appendChild(htr); table.appendChild(thead);
    var tbody=document.createElement('tbody');
    for(var r2=1;r2<rows.length;r2++){
      var row2=rows[r2]||[]; if(row2.join('').trim()==='') continue; if(!matches(row2.join(' '))) continue;
      var tr2=document.createElement('tr');
      row2.forEach(function(c){ var td=document.createElement('td'); if(isUrl(c)){ td.innerHTML=linkify(c);} else { td.textContent=c||''; if(isNum(c)) td.className='num'; } tr2.appendChild(td); });
      tbody.appendChild(tr2); shown++;
    }
    table.appendChild(tbody); wrap.appendChild(table); content.appendChild(wrap);
  }
  if(shown===0){ var e=document.createElement('div'); e.className='state'; e.textContent = state.q ? '「'+state.q+'」に一致する項目はありません' : '項目がありません'; content.appendChild(e); }
  document.getElementById('tab-count').textContent = shown ? '('+shown+'件)' : '';
  var hint=document.createElement('div'); hint.className='hint'; hint.textContent='スプレッドシートの内容をそのまま表示しています。「更新」で最新を再読み込み。'; content.appendChild(hint);
}

function stampUpdated(){
  var d=new Date();
  var p=function(n){return (n<10?'0':'')+n;};
  var s=d.getFullYear()+'/'+p(d.getMonth()+1)+'/'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
  document.getElementById('updated').innerHTML='読込: <span class="mono">'+s+'</span>';
}
function closeDrawer(){ document.getElementById('sidebar').classList.remove('open'); document.getElementById('backdrop').classList.remove('show'); }
function openDrawer(){ document.getElementById('sidebar').classList.add('open'); document.getElementById('backdrop').classList.add('show'); }

function init(){
  buildNav();
  document.getElementById('tab-title').textContent=TABS[0].name;
  document.getElementById('search').addEventListener('input', function(e){ state.q=e.target.value.trim().toLowerCase(); render(); });
  document.getElementById('burger').onclick=openDrawer;
  document.getElementById('backdrop').onclick=closeDrawer;
  document.getElementById('refresh').onclick=function(){ loadTab(state.tab,true); };
  loadTab(0,false);
}
init();
</script>
</body>
</html>
